name: Historian OS Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: historian-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate records and rebuild catalog
        run: python3 scripts/sync_catalog.py

      - name: Commit synchronized catalog
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Historian OS Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already synchronized."
          else
            git commit -m "chore: synchronize Historian catalog"
            git push
          fi

name: Historian OS Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: historian-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate records and rebuild catalog
        run: python3 scripts/sync_catalog.py

      - name: Build automatic knowledge graph
        run: python3 scripts/build_graph.py

      - name: Validate Python engines
        run: python3 -m py_compile scripts/sync_catalog.py scripts/build_graph.py scripts/historian_query.py scripts/historian_api.py scripts/skynet_graph_engine.py scripts/test_skynet_graph_engine.py

      - name: Unit-test canonical graph engine
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Smoke-test HTTP API and graph
        run: |
          python3 scripts/historian_api.py --host 127.0.0.1 --port 8787 > /tmp/historian-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          health = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert health['ok'] is True
          assert health['records'] >= 1
          graph = json.load(open('index/graph.json', encoding='utf-8'))
          assert graph['node_count'] >= 1
          assert graph['edge_count'] >= 1
          PY
          curl --fail --silent 'http://127.0.0.1:8787/search?q=Zumbach' > /tmp/search.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/search.json', encoding='utf-8'))
          assert data['count'] >= 1
          PY
          curl --fail --silent 'http://127.0.0.1:8787/graph' > /tmp/graph.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/graph.json', encoding='utf-8'))
          assert data['node_count'] >= 1
          PY

      - name: Global Integrity Matrix Test (Faza 5)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from skynet_graph_engine import load_corpus, traverse

          records, relations, files, corpus_diag = load_corpus()
          print(f"CORPUS LOADED: RECORDS={len(records)} RELATIONS={len(relations)} FILES={len(files)} SOURCE={corpus_diag['source_state']}")

          if corpus_diag['source_state'] != 'REAL':
              print(f"[FAIL] Canonical corpus is not REAL: {corpus_diag.get('reason')}")
              sys.exit(1)

          test_matrix = [
              {'id': 'HOS-PERSON-JAN-ZUMBACH', 'min_nodes': 15, 'mode': 'undirected'},
              {'id': 'HOS-PERSON-STANISLAW-SKALSKI', 'min_nodes': 3, 'mode': 'undirected'},
              {'id': 'HOS-PERSON-WITOLD-URBANOWICZ', 'min_nodes': 3, 'mode': 'undirected'},
          ]

          failed = False
          for test in test_matrix:
              node_id = test['id']
              min_n = test['min_nodes']
              mode = test['mode']

              visited, edges = traverse(node_id, depth=2, records=records, relations=relations, mode=mode)
              if not visited:
                  status = 'NOT_FOUND' if node_id not in records else 'EMPTY'
              elif len(visited) <= 1 and not edges:
                  status = 'EMPTY'
              else:
                  status = 'REAL'

              print(f"TEST NODE: {node_id} | Status: {status} | Nodes: {len(visited)} | Edges: {len(edges)}")

              if status != 'REAL':
                  print(f"[FAIL] Węzeł {node_id} nie powrócił ze statusem REAL.")
                  failed = True
              elif len(visited) < min_n:
                  print(f"[FAIL] Węzeł {node_id} osiągnął {len(visited)} węzłów (wymagane min. {min_n})")
                  failed = True
              else:
                  print(f"[PASS] Węzeł {node_id} zweryfikowany pomyślnie.")

          if failed:
              print('GLOBAL INTEGRITY CHECK FAILED.')
              sys.exit(1)
          print('ALL GLOBAL INTEGRITY TESTS PASSED - SKYNET FAZA 5 READY.')
          PY

      - name: Commit synchronized catalog and graph
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Historian OS Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/catalog.json index/graph.json
          if git diff --cached --quiet; then
            echo "Catalog and graph already synchronized."
          else
            git commit -m "chore: synchronize Historian catalog and graph"
            git push
          fi

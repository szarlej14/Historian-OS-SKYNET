name: Historian OS Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: historian-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate records and rebuild catalog
        run: python3 scripts/sync_catalog.py

      - name: Build automatic knowledge graph
        run: python3 scripts/build_graph.py

      - name: Validate Python engines
        run: python3 -m py_compile scripts/sync_catalog.py scripts/build_graph.py scripts/historian_query.py scripts/historian_api.py scripts/skynet_graph_engine.py scripts/test_skynet_graph_engine.py

      - name: Unit-test canonical graph engine
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Smoke-test HTTP API and graph
        run: |
          python3 scripts/historian_api.py --host 127.0.0.1 --port 8787 > /tmp/historian-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          health = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert health['ok'] is True
          assert health['records'] >= 1
          graph = json.load(open('index/graph.json', encoding='utf-8'))
          assert graph['node_count'] >= 1
          assert graph['edge_count'] >= 1
          PY
          curl --fail --silent 'http://127.0.0.1:8787/search?q=Zumbach' > /tmp/search.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/search.json', encoding='utf-8'))
          assert data['count'] >= 1
          PY
          curl --fail --silent 'http://127.0.0.1:8787/graph' > /tmp/graph.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/graph.json', encoding='utf-8'))
          assert data['node_count'] >= 1
          assert data['edge_count'] >= 1
          PY

      - name: Global Integrity Matrix Test (Faza 6)
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.parse
          import urllib.request

          BASE = 'http://127.0.0.1:8787'
          EXPECTED_RECORDS = 48
          EXPECTED_RELATIONS = 60
          EXPECTED_SCHEMA = '1.0'
          sys.path.insert(0, 'scripts')
          from skynet_graph_engine import load_corpus

          records, relations, files, corpus_diag = load_corpus()
          print(f"CORPUS LOADED: RECORDS={len(records)} RELATIONS={len(relations)} FILES={len(files)} SOURCE={corpus_diag['source_state']}")

          assert corpus_diag['source_state'] == 'REAL', corpus_diag.get('reason')
          assert len(records) == EXPECTED_RECORDS, f"Expected {EXPECTED_RECORDS} records, got {len(records)}"
          assert len(relations) == EXPECTED_RELATIONS, f"Expected {EXPECTED_RELATIONS} relations, got {len(relations)}"

          matrix = [
              {'id': 'HOS-PERSON-JAN-ZUMBACH', 'min_nodes': 15},
              {'id': 'HOS-PERSON-STANISLAW-SKALSKI', 'min_nodes': 3},
              {'id': 'HOS-PERSON-WITOLD-URBANOWICZ', 'min_nodes': 3},
          ]

          diagnostics = []
          for case in matrix:
              query = urllib.parse.urlencode({'id': case['id'], 'depth': 2, 'mode': 'undirected'})
              with urllib.request.urlopen(f'{BASE}/graph?{query}', timeout=10) as response:
                  payload = json.load(response)

              diagnostic = payload.get('diagnostic', {})
              nodes = payload.get('nodes', [])
              edges = payload.get('edges', [])
              nodes_count = payload.get('nodes_count')
              edges_count = payload.get('edges_count')

              assert payload.get('schema_version') == EXPECTED_SCHEMA, f"{case['id']}: invalid schema_version"
              assert payload.get('source_state') == 'REAL', f"{case['id']}: source_state is not REAL"
              assert diagnostic.get('status') == 'REAL', f"{case['id']}: status is not REAL"
              assert len(nodes) == nodes_count, f"{case['id']}: nodes payload/count mismatch"
              assert len(edges) == edges_count, f"{case['id']}: edges payload/count mismatch"
              assert nodes_count >= case['min_nodes'], f"{case['id']}: {nodes_count} < {case['min_nodes']}"

              diagnostics.append({
                  'id': case['id'],
                  'status': diagnostic.get('status'),
                  'nodes_count': nodes_count,
                  'edges_count': edges_count,
                  'payload_nodes': len(nodes),
                  'payload_edges': len(edges),
              })
              print(f"[PASS] {case['id']} | REAL | nodes={nodes_count}/{len(nodes)} edges={edges_count}/{len(edges)}")

          with open('skynet-diagnostics-global-integrity.json', 'w', encoding='utf-8') as handle:
              json.dump({
                  'schema_version': EXPECTED_SCHEMA,
                  'source_state': corpus_diag['source_state'],
                  'records': len(records),
                  'relations': len(relations),
                  'matrix': diagnostics,
              }, handle, ensure_ascii=False, indent=2)

          print('ALL GLOBAL INTEGRITY TESTS PASSED - SKYNET FAZA 6 BASELINE.')

      - name: Upload SKYNET diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skynet-diagnostics-${{ github.sha }}
          path: skynet-diagnostics-global-integrity.json
          retention-days: 90
          if-no-files-found: error

      - name: Commit synchronized catalog and graph
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Historian OS Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/catalog.json index/graph.json
          if git diff --cached --quiet; then
            echo "Catalog and graph already synchronized."
          else
            git commit -m "chore: synchronize Historian catalog and graph"
            git push
          fi

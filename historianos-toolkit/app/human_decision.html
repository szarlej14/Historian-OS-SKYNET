<!doctype html><meta charset="utf-8"><title>HistorianOS — Human Decision</title><style>body{font:15px system-ui;margin:0;background:#111;color:#eee}header{padding:22px 28px;border-bottom:1px solid #333}main{max-width:1100px;margin:auto;padding:24px}.card{border:1px solid #444;border-radius:12px;padding:18px;margin:14px 0;background:#181818}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.value{padding:12px;background:#222;border-radius:8px}button{padding:10px 16px;margin:6px 6px 0 0;border:0;border-radius:7px;cursor:pointer}textarea,input{width:100%;box-sizing:border-box;background:#111;color:#eee;border:1px solid #555;padding:9px;border-radius:6px}small{color:#aaa}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><header><b>HISTORIANOS / SKYNET</b><div>HUMAN DECISION CENTER</div></header><main><p id="status">Ładowanie kolejki…</p><div id="q"></div></main><script>
const q=document.querySelector('#q'); const st=document.querySelector('#status');
async function load(){let r=await fetch('/api/queue');let a=await r.json();st.textContent='REVIEW QUEUE: '+a.length; q.innerHTML=a.map((x,i)=>`<section class="card"><small>${x.conflict_id} · ${x.status}</small><h2>${x.entity_id||''}</h2><b>${x.attribute||''}</b><div class="grid"><div class="value"><b>Source A</b><br>${x.source_a_val||'—'}</div><div class="value"><b>Source B</b><br>${x.source_b_val||'—'}</div></div><p><input id="v${i}" placeholder="Golden value (wymagane dla APPROVE/MERGE)"></p><p><textarea id="n${i}" placeholder="Uzasadnienie decyzji"></textarea></p><button onclick="decide('${x.conflict_id}',${i},'APPROVE')">APPROVE</button><button onclick="decide('${x.conflict_id}',${i},'MERGE')">MERGE</button><button onclick="decide('${x.conflict_id}',${i},'REJECT')">REJECT</button></section>`).join('')||'<div class="card">Brak otwartych decyzji.</div>'}
async function decide(id,i,action){let v=document.querySelector('#v'+i).value,n=document.querySelector('#n'+i).value;if((action!=='REJECT'&&!v)||!n){alert('Podaj golden value i uzasadnienie.');return}await fetch('/api/decision/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,golden_value:v,justification:n,author:'Piotr Florczyk'})});load()}load();
</script>

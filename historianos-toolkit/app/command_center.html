<!doctype html><meta charset="utf-8"><title>HistorianOS — Command Center</title><style>body{font:15px system-ui;margin:0;background:#0f1012;color:#eee}header{padding:24px;border-bottom:1px solid #333}main{max-width:1100px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #3b3b3b;border-radius:12px;padding:16px;background:#17181b;margin:12px 0}.metric{font-size:28px}.conflict{padding:14px;border-left:3px solid #d6a84f;margin:10px 0;background:#1c1d20}button{padding:9px 14px;border:0;border-radius:7px;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;background:#101114;color:#eee;border:1px solid #555;padding:8px;border-radius:6px}small{color:#aaa}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><header><b>HISTORIANOS / SKYNET</b><div>COMMAND CENTER · GAP → REVIEW → DECISION</div></header><main><div class="grid"><div class="card">OPEN<div id="open" class="metric">—</div></div><div class="card">EXPORTED<div id="exp" class="metric">—</div></div><div class="card">RESOLVED<div id="res" class="metric">—</div></div></div><section class="card"><h2>HUMAN DECISION QUEUE</h2><div id="queue">Ładowanie…</div></section></main><script>
async function load(){const a=await (await fetch('/api/queue')).json();let o=a.filter(x=>x.status==='OPEN').length,e=a.filter(x=>x.status==='EXPORTED').length;open.textContent=o;exp.textContent=e;res.textContent='—';queue.innerHTML=a.map((x,i)=>`<div class="conflict"><small>${x.conflict_id} · ${x.status}</small><h3>${x.entity_id} — ${x.attribute}</h3><div><b>A:</b> ${x.source_a_val||'—'} &nbsp; <b>B:</b> ${x.source_b_val||'—'}</div><p><input id="v${i}" placeholder="Golden value"></p><p><textarea id="n${i}" placeholder="Uzasadnienie decyzji"></textarea></p><button onclick="decide('${x.conflict_id}',${i},'APPROVE')">APPROVE</button> <button onclick="decide('${x.conflict_id}',${i},'MERGE')">MERGE</button> <button onclick="decide('${x.conflict_id}',${i},'REJECT')">REJECT</button></div>`).join('')||'Brak spraw w kolejce.'}
async function decide(id,i,action){let v=document.getElementById('v'+i).value,n=document.getElementById('n'+i).value;if(action!=='REJECT'&&!v||!n)return alert('Golden value i uzasadnienie są wymagane.');await fetch('/api/decision/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,golden_value:v,justification:n,author:'Piotr Florczyk'})});load()}load();
</script>

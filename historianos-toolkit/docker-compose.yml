services:
  command-center:
    build:
      context: ..
      dockerfile: historianos-toolkit/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HISTORIANOS_VAULT: /vault
      PORT: 8080
    volumes:
      - ./example-vaults/zjazd-gnieznienski:/vault:ro
      # Override for a personal vault:
      # - ../HistorianOS-Vault:/vault:ro
    restart: unless-stopped
